services:
  postgres:
    image: postgres:17-alpine
    container_name: atoitalk-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atoitalk_test
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atoitalk-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  s3mock:
    image: adobe/s3mock:latest
    container_name: atoitalk-test-s3mock
    environment:
      initialBuckets: test-public-bucket,test-private-bucket
    ports:
      - "9090:9090"

  mailpit:
    image: axllent/mailpit:latest
    container_name: atoitalk-test-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
