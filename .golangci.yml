version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  exclusions:
    paths:
      - "^internal/infrastructure/mocks/"
      - "^internal/infrastructure/database/repository/mocks/"
      - "^internal/api/application/mocks/"
      - "^internal/messaging/events/mocks/"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
