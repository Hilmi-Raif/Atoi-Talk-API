version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  exclusions:
    paths:
      - "^internal/adapter/mocks/"
      - "^internal/repository/mocks/"
      - "^internal/service/mocks/"
      - "^internal/controller/mocks/"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
