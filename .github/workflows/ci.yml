name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Impacted Areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      shared: ${{ steps.filter.outputs.shared }}
      integration: ${{ steps.filter.outputs.integration }}
      tooling: ${{ steps.filter.outputs.tooling }}
      build_api: ${{ steps.filter.outputs.build_api }}
      build_scheduler: ${{ steps.filter.outputs.build_scheduler }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'cmd/api/**'
              - 'internal/controller/**'
              - 'internal/middleware/**'
              - 'internal/service/**'
              - 'internal/websocket/**'
            scheduler:
              - 'cmd/scheduler/**'
              - 'internal/scheduler/**'
            shared:
              - 'internal/adapter/**'
              - 'internal/config/**'
              - 'internal/constant/**'
              - 'internal/helper/**'
              - 'internal/repository/**'
              - 'ent/**'
              - 'go.mod'
              - 'go.sum'
            integration:
              - 'integration/**'
            tooling:
              - '.github/**'
              - 'Makefile'
              - 'scripts/**'
              - '.golangci.yml'
              - '.mockery.yaml'
              - '.release-please-config.json'
              - '.release-please-manifest.json'
              - 'CHANGELOG.md'
            build_api:
              - 'build/package/api/Dockerfile'
            build_scheduler:
              - 'build/package/scheduler/Dockerfile'

  quality:
    name: Quality And Security
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Download Dependencies
        run: go mod download

      - name: Check Formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.0

      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8

      - name: Run Gosec
        run: gosec -exclude=G104,G117 -exclude-dir=ent -exclude-dir=internal/adapter/mocks -exclude-dir=internal/repository/mocks -exclude-dir=internal/service/mocks -exclude-dir=internal/websocket/mocks ./...

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run Govulncheck
        run: govulncheck ./...

      - name: Install Mockery
        run: go install github.com/vektra/mockery/v2@v2.53.6

      - name: Verify Generated Mocks
        run: make mock-verify

  unit:
    name: Impacted Unit Tests
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    env:
      FULL_UNIT: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true' }}
      API_CHANGED: ${{ needs.changes.outputs.api }}
      SCHEDULER_CHANGED: ${{ needs.changes.outputs.scheduler }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Download Dependencies
        run: go mod download

      - name: Run Impacted Unit Tests
        shell: bash
        run: |
          if [[ "$FULL_UNIT" == "true" ]]; then
            go test ./internal/... -covermode=atomic -coverprofile=coverage-unit.out -count=1
            go test -race ./internal/... -count=1
            exit 0
          fi

          packages=()
          if [[ "$API_CHANGED" == "true" ]]; then
            packages+=(./internal/controller ./internal/middleware ./internal/service ./internal/websocket)
          fi
          if [[ "$SCHEDULER_CHANGED" == "true" ]]; then
            packages+=(./internal/scheduler/...)
          fi
          go test "${packages[@]}" -count=1
          go test -race "${packages[@]}" -count=1

      - name: Upload Unit Coverage
        if: ${{ env.FULL_UNIT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.out

  integration:
    name: Impacted Integration Tests
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atoitalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      s3mock:
        image: adobe/s3mock:latest
        ports:
          - 9090:9090
        env:
          initialBuckets: test-public-bucket,test-private-bucket
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: atoitalk_test
      DB_SSLMODE: disable
      DB_MIGRATE: true
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 1
      S3_BUCKET_PUBLIC: test-public-bucket
      S3_BUCKET_PRIVATE: test-private-bucket
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_ENDPOINT: http://localhost:9090
      S3_PUBLIC_DOMAIN: http://localhost:9090/test-public-bucket
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: test@atoitalk.com
      SMTP_FROM_NAME: AtoiTalk Test
      SMTP_ASYNC: false
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      GOOGLE_REDIRECT_URL: test
      JWT_SECRET: ci-test-secret
      JWT_EXP: 86400
      OTP_SECRET: ci-test-secret
      OTP_EXP: 300
      OTP_RATE_LIMIT_SECONDS: 2
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      APP_ENV: test
      APP_PORT: 8080
      APP_URL: http://localhost:8080
      APP_CORS_ALLOWED_ORIGINS: "*"
    steps:
      - uses: actions/checkout@v4
      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - name: Download Dependencies
        run: go mod download
      - name: Run Integration Tests With Coverage
        run: go test -tags=integration -coverpkg=./... -covermode=atomic -coverprofile=coverage-integration.out ./integration/... -v -count=1
      - name: Upload Integration Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.out

  coverage:
    name: Combined Coverage Gate
    needs: [changes, unit, integration]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - run: go mod download
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-artifacts/unit
      - uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage-artifacts/integration
      - name: Merge And Enforce Coverage
        run: |
          go run ./scripts/merge-coverage -output coverage-merged.out coverage-artifacts/unit/coverage-unit.out coverage-artifacts/integration/coverage-integration.out
          go run ./scripts/check-coverage -profile coverage-merged.out -min 85 -exclude internal/model,internal/bootstrap,scripts,ent,docs,cmd,internal/helper/mocks,internal/adapter/mocks,internal/repository/mocks,internal/service/mocks,internal/websocket/mocks
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage-merged.out

  build_api:
    name: Build API Image
    needs: [changes, quality, unit, integration, coverage]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.build_api == 'true') && needs.quality.result == 'success' && needs.unit.result == 'success' && (needs.changes.outputs.shared != 'true' || (needs.integration.result == 'success' && needs.coverage.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/atoitalk-api
          tags: type=sha,prefix=sha-
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_scheduler:
    name: Build Scheduler Image
    needs: [changes, quality, unit, integration, coverage]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.build_scheduler == 'true') && needs.quality.result == 'success' && needs.unit.result == 'success' && (needs.changes.outputs.shared != 'true' || (needs.integration.result == 'success' && needs.coverage.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/atoitalk-scheduler
          tags: type=sha,prefix=sha-
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/scheduler/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gate:
    name: Selective CI Gate
    if: ${{ always() }}
    needs: [changes, quality, unit, integration, coverage, build_api, build_scheduler]
    runs-on: ubuntu-latest
    steps:
      - name: Check Impacted Job Results
        env:
          API_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.build_api == 'true' }}
          SCHEDULER_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.build_scheduler == 'true' }}
          QUALITY_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true' }}
          UNIT_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true' }}
          INTEGRATION_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true' }}
          COVERAGE_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.tooling == 'true' }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          API_RESULT: ${{ needs.build_api.result }}
          SCHEDULER_RESULT: ${{ needs.build_scheduler.result }}
        shell: bash
        run: |
          failed=0
          check_required() {
            local required="$1"
            local result="$2"
            local name="$3"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "$name result: $result"
              failed=1
            fi
          }
          check_required "$QUALITY_REQUIRED" "$QUALITY_RESULT" quality
          check_required "$UNIT_REQUIRED" "$UNIT_RESULT" unit
          check_required "$INTEGRATION_REQUIRED" "$INTEGRATION_RESULT" integration
          check_required "$COVERAGE_REQUIRED" "$COVERAGE_RESULT" coverage
          check_required "$API_REQUIRED" "$API_RESULT" build_api
          check_required "$SCHEDULER_REQUIRED" "$SCHEDULER_RESULT" build_scheduler
          exit "$failed"
